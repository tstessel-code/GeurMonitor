<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><title>GeurMonitor</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f6;color:#17211f}*{box-sizing:border-box}body{margin:0}header{background:#0f766e;color:#fff;padding:18px}h1{margin:0;font-size:22px}.wrap{max-width:620px;margin:auto;padding:16px 16px 90px}.card{background:#fff;padding:16px;border-radius:18px;margin-bottom:14px;box-shadow:0 3px 16px #0001}.hero{text-align:center;padding:28px 16px}.heroIcon{font-size:48px}.btn{width:100%;padding:15px;margin-top:12px;border:0;border-radius:14px;background:#0f766e;color:white;font-weight:800;font:inherit}.secondary{background:#e7f1ef;color:#0f5f59}.hidden{display:none!important}.muted{font-size:13px;color:#65736f}.choice,.odors,.fields,.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice button,.odor{padding:12px;border:2px solid #d4dfdc;border-radius:12px;background:white;font-weight:700}.choice button.sel,.odor.sel{border-color:#0f766e;background:#e7f1ef;color:#0f5f59}.odor{text-align:left;min-height:58px}.odor span{font-size:20px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.level{padding:10px 3px;border:2px solid transparent;border-radius:12px;font-size:11px;font-weight:700}.level b{display:block;font-size:21px}.level.sel{border-color:#111}label{display:block;font-weight:700;margin:13px 0 7px}input,textarea{width:100%;padding:12px;border:1px solid #ccd6d3;border-radius:12px;font:inherit}textarea{min-height:75px}.box{background:#f4f8f7;padding:12px;border-radius:12px;margin-top:9px}.wind{background:#eef7f5;padding:10px;border-radius:12px;margin-top:8px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid #ddd}.nav button{width:min(33.3%,205px);padding:13px 3px 17px;border:0;background:#fff}.nav .active{color:#0f766e;font-weight:800}.item{border-left:6px solid #999;background:#f5f8f7;padding:10px;border-radius:10px;margin:8px 0}.sync{font-size:12px;color:#08734f}.stat{background:#f4f8f7;padding:12px;border-radius:12px}.stat b{display:block;font-size:22px;color:#0f766e}@media(max-width:400px){.odors,.fields{grid-template-columns:1fr}.levels{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><h1>🌬️ GeurMonitor</h1></header><main class="wrap">
<section id="home"><div class="card hero"><div class="heroIcon">🌬️</div><h2>Geurhinder monitoren</h2><p>Registreer snel een nieuwe waarneming.</p><button class="btn" id="new">＋ Geurhinder toevoegen</button></div><div class="card muted" id="cloud">Online database controleren…</div></section>
<section id="form" class="hidden"><div class="card"><h2>Nieuwe geurmelding</h2><label>Wanneer?</label><div class="choice"><button id="now" class="sel">Nu</button><button id="earlier">Eerder</button></div><div id="datebox" class="box hidden"><div class="fields"><div><label>Datum</label><input type="date" id="date"></div><div><label>Tijd</label><input type="time" id="time"></div></div></div><label>Intensiteit</label><div class="levels" id="levels"></div><label>Geurtype</label><div class="odors" id="odors"></div><div id="otherbox" class="box hidden"><label>Andere geur</label><input id="other" maxlength="100" placeholder="Beschrijf de geur kort"></div><label>Locatie</label><button class="btn secondary" id="gps">📍 Huidige locatie gebruiken</button><button class="btn secondary hidden" id="manual">Coördinaten handmatig invullen</button><div id="coords" class="box hidden"><div class="fields"><input id="lat" type="number" step="any" placeholder="Breedtegraad"><input id="lon" type="number" step="any" placeholder="Lengtegraad"></div></div><div class="muted" id="gpss">Nog geen locatie.</div><div class="wind muted" id="winds">Windgegevens worden automatisch opgehaald.</div><label>Opmerking (optioneel)</label><textarea id="comment"></textarea><button class="btn" id="save">Melding opslaan</button><button class="btn secondary" id="cancel">Annuleren</button></div></section>
<section id="success" class="hidden"><div class="card hero"><div style="font-size:48px;color:#078052">✓</div><h2>Melding succesvol opgeslagen</h2><p id="successText"></p><button class="btn" id="back">Terug naar hoofdpagina</button></div></section>
<section id="reports" class="hidden"><div class="card"><h2>Meldingen</h2><button class="btn secondary" id="sync">Synchroniseren</button><div id="list"></div></div></section>
<section id="dashboard" class="hidden"><div class="card"><h2>Dashboard</h2><div class="stats"><div class="stat"><b id="today">0</b>Vandaag</div><div class="stat"><b id="week">0</b>7 dagen</div><div class="stat"><b id="highest">–</b>Hoogste</div><div class="stat"><b id="common">–</b>Meest gemeld</div></div></div></section></main><nav class="nav"><button data-page="home" class="active">⌂<br>Home</button><button data-page="reports">☷<br>Meldingen</button><button data-page="dashboard">▥<br>Dashboard</button></nav>
<script src="config.js"></script><script src="weather-module.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=x=>document.getElementById(x),D=[['Geen','#4caf50'],['Licht','#c9d72e'],['Matig','#f5a623'],['Sterk','#e84a3c'],['Zeer sterk','#7d2b73']],O=[['🥚','Rotte eieren'],['🧅','Rotte ui / look'],['🥬','Rotte kool'],['🚽','Riool / putlucht'],['💩','Mest / gier'],['🌿','Compost / rottend groen'],['🤢','Rottend organisch materiaal'],['🧪','Ammoniak / urine'],['🍺','Gistend / gegist'],['🍋','Zuur / ranzig'],['✏️','Andere geur']];let level=null,odor='',mode='now',loc=null,wind=null,db=null;const get=()=>JSON.parse(localStorage.getItem('geurmonitor')||'[]'),put=a=>localStorage.setItem('geurmonitor',JSON.stringify(a));
const cfg=window.GEURMONITOR_CONFIG||{};if(cfg.supabaseUrl&&cfg.supabaseAnonKey&&!cfg.supabaseUrl.startsWith('VUL_')){db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);$('cloud').innerHTML='☁️ <b>Online opslag actief</b>'}else $('cloud').textContent='⚠️ Online opslag niet ingesteld.';
D.forEach((d,i)=>{let b=document.createElement('button');b.className='level';b.style.background=d[1]+'26';b.innerHTML=`<b>${i}</b>${d[0]}`;b.onclick=()=>{level=i;document.querySelectorAll('.level').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('levels').append(b)});O.forEach(([ic,n])=>{let b=document.createElement('button');b.className='odor';b.innerHTML=`<span>${ic}</span> ${n}`;b.onclick=()=>{odor=n==='Andere geur'?'':n;document.querySelectorAll('.odor').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('otherbox').classList.toggle('hidden',n!=='Andere geur')};$('odors').append(b)});
function page(id){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='reports'||id==='dashboard')sync()}
function pad(n){return String(n).padStart(2,'0')}function reset(){level=null;odor='';mode='now';loc=null;wind=null;document.querySelectorAll('.level,.odor').forEach(x=>x.classList.remove('sel'));$('now').classList.add('sel');$('earlier').classList.remove('sel');$('datebox').classList.add('hidden');$('manual').classList.add('hidden');$('coords').classList.add('hidden');$('otherbox').classList.add('hidden');$('other').value=$('comment').value=$('lat').value=$('lon').value='';let d=new Date();$('date').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;$('date').max=$('date').value;$('time').value=`${pad(d.getHours())}:${pad(d.getMinutes())}`;$('gpss').textContent='Nog geen locatie.';$('winds').textContent='Windgegevens worden automatisch opgehaald.'}
function moment(){if(mode==='now')return new Date();let d=new Date(`${$('date').value}T${$('time').value}:00`);return isNaN(d)?null:d}function location(){if(loc)return loc;let a=parseFloat($('lat').value),o=parseFloat($('lon').value);return Number.isFinite(a)&&Number.isFinite(o)?{lat:a,lon:o}:null}async function weather(){let m=moment(),l=location();if(!m||!l)return;if(m>new Date())return;$('winds').textContent='💨 Windgegevens ophalen…';try{wind=await fetchWindForDateTime(l.lat,l.lon,m);$('winds').textContent=`💨 ${wind.windSpeedKmh??'–'} km/u · ${wind.windDirectionCompass??'–'} (${wind.windDirectionDeg==null?'–':Math.round(wind.windDirectionDeg)+'°'})`}catch{wind=null;$('winds').textContent='Windgegevens niet beschikbaar. Opslaan kan wel.'}}
$('now').onclick=()=>{mode='now';reset()};$('earlier').onclick=()=>{mode='earlier';$('now').classList.remove('sel');$('earlier').classList.add('sel');$('datebox').classList.remove('hidden');$('manual').classList.remove('hidden')};$('manual').onclick=()=> $('coords').classList.toggle('hidden');['date','time','lat','lon'].forEach(x=>$(x).onchange=weather);$('gps').onclick=()=>navigator.geolocation.getCurrentPosition(async p=>{loc={lat:p.coords.latitude,lon:p.coords.longitude};$('lat').value=loc.lat;$('lon').value=loc.lon;$('gpss').textContent='✓ Locatie bepaald';await weather()},()=>$('gpss').textContent='Locatie niet beschikbaar.');
async function upload(r){if(!db)return false;let row={id:r.id,observed_at:r.ts,intensity:r.intensity,intensity_label:r.label,odor_type:r.odor||null,latitude:r.lat,longitude:r.lon,comment:r.comment||null,wind_speed_kmh:r.windSpeedKmh??null,wind_direction_deg:r.windDirectionDeg??null,wind_direction_compass:r.windDirectionCompass??null,weather_observed_at:r.weatherObservedAt||null,weather_source:r.weatherSource||null};let {error}=await db.from('odor_reports').upsert(row,{onConflict:'id'});return !error}
$('save').onclick=async()=>{let m=moment(),l=location(),o=odor||$('other').value.trim();if(level===null)return alert('Kies de intensiteit.');if(!m||m>new Date())return alert('Kies een geldig tijdstip in het verleden of nu.');if(mode==='earlier'&&!l)return alert('Geef de locatie van de waarneming op.');if(l&&!wind)await weather();let r={id:crypto.randomUUID(),ts:m.toISOString(),intensity:level,label:D[level][0],odor:o,lat:l?.lat??null,lon:l?.lon??null,comment:$('comment').value.trim(),windSpeedKmh:wind?.windSpeedKmh??null,windDirectionDeg:wind?.windDirectionDeg??null,windDirectionCompass:wind?.windDirectionCompass??null,weatherObservedAt:wind?.weatherObservedAt??null,weatherSource:wind?.weatherSource??null,synced:false},a=get();a.unshift(r);put(a);let ok=await upload(r);if(ok){r.synced=true;put(a)}$('successText').textContent=ok?'De melding is online opgeslagen.':'De melding is lokaal bewaard.';reset();page('success')};
async function sync(){let a=get();if(db){for(let r of a)if(!r.synced)r.synced=await upload(r);let {data}=await db.from('odor_reports').select('*').order('observed_at',{ascending:false});if(data){a=data.map(x=>({id:x.id,ts:x.observed_at,intensity:x.intensity,label:x.intensity_label,odor:x.odor_type,lat:x.latitude,lon:x.longitude,comment:x.comment,windSpeedKmh:x.wind_speed_kmh,windDirectionDeg:x.wind_direction_deg,windDirectionCompass:x.wind_direction_compass,synced:true}));put(a)}}render(a)}function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(a=get()){$('list').innerHTML=a.map(r=>`<div class="item" style="border-color:${D[r.intensity]?.[1]||'#999'}"><b>${new Date(r.ts).toLocaleString('nl-BE')}</b><div>${esc(r.label)}${r.odor?' · '+esc(r.odor):''}</div>${r.windSpeedKmh!=null?`<div class="muted">💨 ${r.windSpeedKmh} km/u · ${esc(r.windDirectionCompass)}</div>`:''}<div class="sync">${r.synced?'☁ Online':'↻ Wacht op synchronisatie'}</div></div>`).join('')||'<p class="muted">Nog geen meldingen.</p>';let n=new Date();$('today').textContent=a.filter(x=>new Date(x.ts).toDateString()===n.toDateString()).length;$('week').textContent=a.filter(x=>n-new Date(x.ts)<=7*864e5).length;$('highest').textContent=a.length?D[Math.max(...a.map(x=>x.intensity))][0]:'–';let c={};a.map(x=>x.odor).filter(Boolean).forEach(x=>c[x]=(c[x]||0)+1);$('common').textContent=Object.keys(c).length?Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]:'–'}
$('new').onclick=()=>{reset();page('form')};$('cancel').onclick=$('back').onclick=()=>page('home');$('sync').onclick=sync;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));reset();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
